name: test

on: [push]

jobs:
  build:
    name: build (v22.15.1)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: v22.15.1
          cache: pnpm
      - name: Web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
        env:
          CI: true
