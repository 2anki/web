name: Lint server

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: v22.15.1
          cache: pnpm
      - name: Run lint
        run: |
          pnpm install --frozen-lockfile
          pnpm lint
        env:
          CI: true
