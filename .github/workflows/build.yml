name: Build

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: v22.15.1
          cache: pnpm
      - name: Install and build
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build
        env:
          CI: true
